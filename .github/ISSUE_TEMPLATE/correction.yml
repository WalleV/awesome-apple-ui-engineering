name: Report an outdated or incorrect entry
description: Report a broken link, factual error, license issue, or superseded resource.
title: "[Correction]: "
labels: []
body:
  - type: input
    id: entry
    attributes:
      label: Entry name or URL
      placeholder: Paste the current resource name or URL
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Problem type
      options:
        - Broken or redirected link
        - Incorrect description
        - Incorrect platform or requirement
        - Incorrect or unclear license
        - Archived, unmaintained, or superseded project
        - Duplicate or overlapping resource
        - Suggested removal or replacement
        - Other factual correction
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or outdated?
      description: Explain the user-facing impact, not only the observed change.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: First-party evidence
      description: Link to upstream documentation, releases, repository state, or license text.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional proposed wording, replacement, or removal rationale.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I checked the current main branch before filing this report.
          required: true
        - label: I did not include sensitive personal information.
          required: true

